version: '3.8'

services:
  backend:
    image: ghcr.io/emmauzishakes/events-ticketing-system-b:latest
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 --workers 4 ticketing_system.wsgi:application"
    ports:
      - "8000:8000"
    env_file:
      - .env.web # Create this file on the server with your production secrets

  frontend:
    image: ghcr.io/emmauzishakes/events-ticketing-system-f:latest
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.frontend # Create this file on the server
    depends_on:
      - backend