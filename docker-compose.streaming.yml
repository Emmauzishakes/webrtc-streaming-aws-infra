version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - livekit-net

  livekit:
    image: livekit/livekit-server:latest
    restart: always
    network_mode: "host" # Required for WebRTC UDP traffic
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    depends_on:
      - redis

  recording-worker:
    image: ghcr.io/emmauzishakes/event-recording-worker:latest
    restart: always
    environment:
      - LIVEKIT_URL=ws://127.0.0.1:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - BACKEND_URL=${BACKEND_URL}
      - WORKER_SECRET=${RECORDING_WORKER_SECRET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
    depends_on:
      - livekit
    networks:
      - livekit-net

networks:
  livekit-net:
    driver: bridge